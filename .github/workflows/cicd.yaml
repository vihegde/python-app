name: cicd

on:
  push:
    paths:
     - src/**
    branches:
     - main
jobs:
  ci:
    
    runs-on: ubuntu-latest

    steps:
      - name: Shorten Commit ID
        shell: bash
        run:
           echo "COMMIT_ID=${GITHUB_SHA::6}" >> "$GITHUB_ENV"           
      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: vihegde23021985/python-app:${{ env.COMMIT_ID }}
    outputs:
        commit_id: ${{ env.COMMIT_ID }}
  cd:
    needs: ci
    runs-on: self-hosted
    steps:
      - name: Install Python and Pip
        run:
            sudo apt update && sudo apt install -y python3.12-venv python3-pip 

      - name: Verify installation
        run: 
            python3 --version && pip3 --version

      - uses: actions/checkout@v3
      - name: "Modify values fullnameOverride"
        shell: bash
        run:
          echo ${{needs.ci.outputs.commit_id}} &&  python3 -m venv .venv && source .venv/bin/activate && pip install yq && yq -Yi '.image.tag = "${{needs.ci.outputs.commit_id}}"' charts/python-app/values.yaml
      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          message: 'Updates the values commit ID to tags ${{needs.ci.outputs.commit_id}}'


      - name: Install-ArgoCD
        shell: bash
        run: 
           sudo curl -ksSL -v -o  argocd https://argocd-server.argocd/download/argocd-linux-amd64 && sudo chmod  +x ./argocd && sudo mv ./argocd /usr/local/bin/argocd
      - name: Argocd app sync
        shell: bash
        run:
           argocd login argocd-server.argocd --insecure --username admin --password ${{secrets.ARGOCD_PASSWORD}} --grpc-web && argocd app sync python-app